name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://user:pass@localhost:6543/postgres?sslmode=disable
      DIRECT_URL: postgresql://user:pass@localhost:5432/postgres?sslmode=disable
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      COOKIE_SECURE: "false"
      APP_ORIGIN: http://localhost:3000
      COMPARISON_SERVICE_URL: http://localhost:8080
      COMPARISON_SHARED_SECRET: ci-only-shared-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  comparison-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comparison-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: comparison-service/go.mod
          cache-dependency-path: comparison-service/go.sum
      - run: go vet ./...
      - run: go test ./...
