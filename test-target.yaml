openapi: 3.0.3
info:
  title: Diffora Test API
  version: 2.0.0
  description: Target version used to exercise every comparison category.
  termsOfService: https://example.com/terms
  contact:
    name: Diffora Platform
    email: platform@example.com
  license:
    name: Apache-2.0
servers:
  - url: https://api2.example.com/v2
    description: Production v2
  - url: https://staging.example.com/v2
    description: Staging
tags:
  - name: pets
    description: Pet operations
  - name: owners
    description: Owner and account operations
  - name: catalog
    description: Catalog operations
externalDocs:
  description: Target documentation
  url: https://docs.example.com/target
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      tags: [pets, catalog]
      summary: List all pets
      description: Returns a filtered and paginated list of pets.
      operationId: listAllPets
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          description: Maximum number of pets to return.
          schema:
            type: integer
            format: int32
            minimum: 2
            maximum: 200
            multipleOf: 5
            default: 50
        - name: filter
          in: query
          required: false
          description: Free-text filter.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, updated]
      responses:
        '200':
          description: A list of pets.
          headers:
            X-Total-Count:
              description: Total pets.
              schema:
                type: integer
            X-Rate-Limit:
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [pets]
      summary: Create a pet
      description: Creates a new pet with optional metadata.
      operationId: createPetV2
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PetBody'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pet already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: Pet identifier.
        schema:
          type: string
          format: uuid
    get:
      tags: [pets]
      summary: Get a pet
      description: Returns one pet by identifier.
      operationId: getPet
      responses:
        '200':
          description: A pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [pets]
      summary: Update a pet
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [pets]
      summary: Delete a pet
      operationId: deletePet
      deprecated: true
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /owners:
    get:
      tags: [owners]
      summary: List owners
      operationId: listOwners
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Owners.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Owner'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /owners/{ownerId}:
    parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [owners]
      summary: Get an owner
      operationId: getOwner
      responses:
        '200':
          description: An owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFound'
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        minimum: 2
        maximum: 100
        default: 2
  headers:
    RequestId:
      description: Request identifier.
      schema:
        type: string
        format: uuid
  requestBodies:
    PetBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewPet'
        application/xml:
          schema:
            type: string
  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Pet:
      type: object
      required: [id, name, ownerId]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [available, pending, reserved]
        tag:
          type: string
          maxLength: 40
        microchip:
          type: string
          pattern: '^[0-9]{15}$'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        ownerId:
          type: string
          format: uuid
          nullable: false
    NewPet:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [available, pending, reserved]
        tag:
          type: string
          maxLength: 40
        age:
          type: integer
          minimum: 0
          maximum: 60
    PetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [available, pending, reserved]
        tag:
          type: string
          maxLength: 40
    Owner:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
    OwnerInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
    Error:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
