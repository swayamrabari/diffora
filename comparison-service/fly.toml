# Fly.io deployment for the Diffora comparison service.
#
#   fly apps create <your-app-name>
#   fly secrets set SHARED_SECRET=<same value as COMPARISON_SHARED_SECRET>
#   fly deploy
#
# Change `app` and `primary_region` to match your Fly organization. Keep the
# region close to both Supabase and the Vercel function region.

app = "diffora-comparison"
primary_region = "bom"

kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  OASDIFF_BIN = "/usr/local/bin/oasdiff"
  VALIDATE_TIMEOUT_SECONDS = "20"
  DIFF_TIMEOUT_SECONDS = "60"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm: diff latency matters more than idle cost.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
