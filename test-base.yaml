openapi: 3.0.3
info:
  title: Diffora Test API
  version: 1.0.0
  description: Base version used to exercise every comparison category.
  contact:
    name: Diffora
    email: test@example.com
  license:
    name: MIT
servers:
  - url: https://api.example.com/v1
    description: Production
tags:
  - name: pets
    description: Pet operations
  - name: owners
    description: Owner operations
externalDocs:
  description: Base documentation
  url: https://docs.example.com/base
security:
  - apiKeyAuth: []
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      description: Returns a paginated list of pets.
      operationId: listPets
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          description: Maximum number of pets.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, created]
      responses:
        '200':
          description: A list of pets.
          headers:
            X-Total-Count:
              description: Total pets.
              schema:
                type: integer
            X-Rate-Limit:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [pets]
      summary: Create a pet
      description: Creates a new pet.
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: Pet identifier.
        schema:
          type: string
          format: uuid
    get:
      tags: [pets]
      summary: Get a pet
      operationId: getPet
      responses:
        '200':
          description: A pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [pets]
      summary: Update a pet
      operationId: updatePet
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [pets]
      summary: Delete a pet
      operationId: deletePet
      responses:
        '204':
          description: Deleted.
  /pets/{petId}/status:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [pets]
      summary: Set pet status
      operationId: setPetStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [available, sold]
      responses:
        '200':
          description: Updated.
  /owners:
    get:
      tags: [owners]
      summary: List owners
      operationId: listOwners
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Owners.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Owner'
  /legacy:
    get:
      summary: Legacy endpoint
      operationId: legacyEndpoint
      deprecated: true
      responses:
        '200':
          description: OK.
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        minimum: 1
        default: 1
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum: [available, sold, pending]
        age:
          type: integer
          minimum: 0
          maximum: 50
        ownerId:
          type: string
          format: uuid
          nullable: true
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        age:
          type: integer
          minimum: 0
          maximum: 50
    PetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum: [available, sold, pending]
    Owner:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
